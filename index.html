<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Une surprise pour toi 🎁</title>
<style>
:root{--bg1:#0b1230;--bg2:#1c2a6b;--ink:#fff;--accent:#ffd36b;--pink:#ff9ec7}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;height:100%;overflow:hidden;font-family:'Poppins','Segoe UI',system-ui,sans-serif;color:var(--ink);background:radial-gradient(ellipse at 50% 120%,#5b3a8f 0,var(--bg2) 40%,var(--bg1) 80%)}
.stars{position:fixed;inset:0;background-image:radial-gradient(2px 2px at 20% 30%,#fff,transparent),radial-gradient(1.5px 1.5px at 70% 20%,#fff,transparent),radial-gradient(2px 2px at 40% 70%,#ffe9a8,transparent),radial-gradient(1.5px 1.5px at 85% 60%,#fff,transparent),radial-gradient(1px 1px at 10% 80%,#fff,transparent),radial-gradient(2px 2px at 60% 45%,#ffe9a8,transparent);background-size:300px 300px;animation:tw 4s ease-in-out infinite alternate;opacity:.8}
@keyframes tw{to{opacity:.35}}
#stage{position:relative;z-index:2;height:100%;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:72px 16px calc(24px + env(safe-area-inset-bottom,0px));gap:22px}
.card{width:100%;max-width:520px;padding:34px 28px;border-radius:28px;background:rgba(255,255,255,.08);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.2);box-shadow:0 20px 60px rgba(0,0,0,.35);animation:in .7s cubic-bezier(.2,.9,.3,1.2)}
@keyframes in{from{opacity:0;transform:translateY(24px) scale(.96)}}
h1{font-size:clamp(1.5rem,5vw,2.2rem);margin:0 0 12px;line-height:1.2}
p{margin:0;font-size:1.08rem;opacity:.92;line-height:1.55;white-space:pre-line}
.tag{display:inline-block;font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.date{font-size:.85rem;opacity:.6;margin-bottom:14px}
.code{margin-top:18px;font-family:ui-monospace,'Courier New',monospace;font-size:clamp(1rem,4.2vw,1.35rem);letter-spacing:.08em;color:var(--accent);background:rgba(0,0,0,.25);border:1px dashed rgba(255,211,107,.45);border-radius:14px;padding:14px 12px;word-break:break-word;white-space:pre-wrap}
button{font:inherit;font-weight:600;font-size:1.05rem;color:#2a1a00;background:linear-gradient(135deg,var(--accent),#ffb347);border:0;border-radius:99px;padding:14px 34px;cursor:pointer;box-shadow:0 8px 24px rgba(255,179,71,.4);transition:transform .2s}
button:hover{transform:translateY(-2px) scale(1.04)}
.ghost{background:rgba(255,255,255,.1);color:#fff;box-shadow:none;border:1px solid rgba(255,255,255,.25);padding:10px 22px;font-size:.95rem}
.next{font-size:.95rem;opacity:.85}.next b{font-variant-numeric:tabular-nums;color:var(--accent);font-size:1.15rem;letter-spacing:.04em}
.bar{width:min(320px,80vw);height:6px;border-radius:9px;background:rgba(255,255,255,.15);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--accent));border-radius:9px}
.prog{font-size:.8rem;opacity:.65;margin-top:-12px}
#hist{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:14px;z-index:6;padding:10px 16px;font-size:.92rem}
#panel{position:fixed;inset:0;z-index:7;background:rgba(5,8,25,.6);opacity:0;pointer-events:none;transition:opacity .3s}
#panel.show{opacity:1;pointer-events:auto}
#panel .sheet{position:absolute;top:0;left:0;bottom:0;width:min(380px,88vw);background:linear-gradient(180deg,#1c2a6b,#0b1230);border-right:1px solid rgba(255,255,255,.15);padding:calc(18px + env(safe-area-inset-top,0px)) 14px 18px;overflow-y:auto;transform:translateX(-100%);transition:transform .35s cubic-bezier(.2,.9,.3,1)}
#panel.show .sheet{transform:none}
.sheet h3{margin:4px 6px 14px;font-size:1.15rem;display:flex;justify-content:space-between;align-items:center}
.sheet h3 button{padding:6px 14px;font-size:.85rem}
.item{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:rgba(255,255,255,.06);color:#fff;box-shadow:none;border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:12px 14px;margin-bottom:8px;font-weight:500;font-size:.95rem}
.item:hover{transform:none;background:rgba(255,255,255,.12)}
.item .n{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(255,211,107,.18);color:var(--accent);font-weight:700;font-size:.9rem}
.item small{display:block;opacity:.55;font-weight:400;font-size:.78rem}
.item.cur{border-color:var(--accent)}
.item.lock{opacity:.4;cursor:default}
.gift{position:relative;width:170px;height:170px;cursor:pointer;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
.box{position:absolute;bottom:0;left:10px;right:10px;height:110px;background:linear-gradient(135deg,#ff6fa5,#e2438a);border-radius:10px}
.box:after,.lid:after{content:"";position:absolute;left:50%;top:0;bottom:0;width:26px;margin-left:-13px;background:var(--accent)}
.lid{position:absolute;top:22px;left:0;right:0;height:50px;background:linear-gradient(135deg,#ff8cb8,#ee5a9a);border-radius:10px;transition:transform .9s cubic-bezier(.3,1.4,.5,1),opacity .9s;z-index:2}
.lid:before{content:"🎀";position:absolute;top:-30px;left:50%;transform:translateX(-50%);font-size:44px}
.gift.open{animation:none}.gift.open .lid{transform:translateY(-120px) rotate(-18deg);opacity:0}
.gift.open .box{box-shadow:0 0 120px 40px rgba(255,211,107,.8)}
#reveal{position:fixed;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:16px;background:rgba(5,8,25,.92);opacity:0;pointer-events:none;transition:opacity 1s}
#reveal.show{opacity:1;pointer-events:auto}
#reveal img{max-width:min(96vw,1100px);max-height:72vh;width:auto;border-radius:20px;box-shadow:0 30px 90px rgba(0,0,0,.6),0 0 60px rgba(255,211,107,.25);transform:scale(.7) rotate(-2deg);opacity:0;transition:transform 1.2s cubic-bezier(.2,1.2,.3,1) .5s,opacity 1s .5s}
#reveal.show img{transform:none;opacity:1}
#reveal h2{margin:0;font-size:clamp(1.3rem,4.5vw,2rem);opacity:0;transition:opacity 1s 1.4s}#reveal.show h2{opacity:1}
#reveal button{opacity:0;transition:opacity 1s 2s}#reveal.show button{opacity:1}
canvas{position:fixed;inset:0;z-index:9;pointer-events:none}
</style></head><body>

<div id="stage"></div>
<div id="reveal"><h2 id="rh"></h2><img id="ri" alt=""><button id="again">Revoir les indices</button></div>

function dec(s){const b=atob(s),u=new Uint8Array(b.length);for(let k=0;k<b.length;k++)u[k]=b.charCodeAt(k)^K.charCodeAt(k%K.length);return new TextDecoder().decode(u)}
const Z=JSON.parse(dec(D)),C=Z.c,N=C.length;           // N indices, puis le cadeau
const START=Date.UTC(DEBUT[0],DEBUT[1]-1,DEBUT[2]);
let off=0;                                              // décalage horloge serveur - appareil
const fmt=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Paris',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'});
function paris(h){const o={};fmt.formatToParts(new Date(Date.now()+off-(h||0)*36e5)).forEach(x=>o[x.type]=x.value);return o}
function day(h){const o=paris(h);return Math.floor((Date.UTC(+o.year,+o.month-1,+o.day)-START)/864e5)}
function today(){const d=day(HEURE);return d>=N&&day(HEURE_CADEAU)<N?N-1:d}  // 0 = 1er indice, N = cadeau
function dateOf(d){return new Date(START+d*864e5).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',timeZone:'UTC'})}
const FIN=dateOf(N)+' à '+HEURE_CADEAU+'h';
const st=document.getElementById('stage'),hist=document.getElementById('hist'),panel=document.getElementById('panel'),list=document.getElementById('list');
let cur=null,tick=null,lastDay=null;
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function left(){const t=today(),o=paris(0),now=Date.UTC(+o.year,+o.month-1,+o.day,+o.hour,+o.minute,+o.second),s=Math.max(0,Math.round((START+(t+1)*864e5+(t+1>=N?HEURE_CADEAU:HEURE)*36e5-now)/1e3));const p=n=>String(n).padStart(2,'0');return p(Math.floor(s/3600))+':'+p(Math.floor(s%3600/60))+':'+p(s%60)}
function seen(){try{return localStorage.getItem('surprise-vu')==='1'}catch(e){return false}}
function markSeen(){try{localStorage.setItem('surprise-vu','1')}catch(e){}}
function render(){
 const t=today();lastDay=t;clearInterval(tick);hist.hidden=t<0;
 if(t<0){st.innerHTML=`<div class="card"><div class="tag">Patience…</div><h1>Quelque chose se prépare</h1><p>Reviens un peu plus tard…</p></div>`;return}
 if(cur===null&&!seen()){
  st.innerHTML=`<div class="card"><div class="tag">Pour toi</div><h1>Quelqu'un t'a préparé une surprise…</h1><p>Elle ne se découvre pas en un jour.\nChaque jour, un nouvel indice apparaît ici. Le ${FIN}, tu auras ta réponse.\n\nTous les anciens indices restent dans le bouton en haut à gauche. Bonne chance 🕵️‍♀️</p></div><button id="go">${t?"Voir l'indice du jour ✨":"Voir le premier indice ✨"}</button>`;
  document.getElementById('go').onclick=()=>{markSeen();render()};hist.hidden=true;return}
 const show=cur===null?Math.min(t,N):cur;
 if(show>=N){finale();return}
 const c=C[show],live=show===Math.min(t,N-1)&&t<N;
 st.innerHTML=`<div class="card"><div class="tag">Indice n°${show+1}</div><div class="date">${dateOf(show)}</div><h1>${esc(c.t)}</h1><p>${esc(c.p)}</p>${c.code?`<div class="code">${esc(c.code)}</div>`:''}</div>`+
  (live?`<div class="next">${show+1>=N?'Ouverture du cadeau':'Prochain indice'} dans <b id="cd">${left()}</b></div>`:`<button class="ghost" id="back">Revenir à l'indice du jour</button>`)+
  `<div class="bar"><i style="width:${(Math.min(t+1,N)/N*100).toFixed(1)}%"></i></div><div class="prog">${Math.min(t+1,N)} indice${t?'s':''} sur ${N} · le dernier mot le ${FIN}</div>`;
 const b=document.getElementById('back');if(b)b.onclick=()=>{cur=null;render()};
 tick=setInterval(()=>{if(today()!==lastDay){cur=null;render();return}const e=document.getElementById('cd');if(e)e.textContent=left()},1000);
}
function finale(){
 hist.hidden=false;
 st.innerHTML=`<div class="card"><div class="tag">Dernière étape</div><h1>Ouvre ton cadeau</h1><p>Tu as eu ${N} nuits pour deviner. Touche la boîte 👇</p></div><div class="gift" id="g"><div class="lid"></div><div class="box"></div></div>`;
 document.getElementById('g').onclick=function(){if(this.classList.contains('open'))return;this.classList.add('open');confetti();
  const r=JSON.parse(dec(Z.r)),im=document.getElementById('ri');document.getElementById('rh').textContent=r.h;im.alt=r.a;im.src='data:image/jpeg;base64,'+r.i;
  setTimeout(()=>{document.getElementById('reveal').classList.add('show');confetti()},1100)};
}
function openList(){
 const t=today();let h='';
 for(let k=0;k<=N;k++){const ok=k<=t,fin=k===N;
  h+=`<button class="item${ok?'':' lock'}${(cur===null?Math.min(t,N):cur)===k?' cur':''}" data-k="${k}"${ok?'':' disabled'}><span class="n">${ok?(fin?'🎁':k+1):'🔒'}</span><span>${ok?(fin?'Le cadeau':esc(C[k].t)):'Pas encore…'}<small>${fin?FIN:dateOf(k)}</small></span></button>`}
 list.innerHTML=h;panel.classList.add('show');
 const c=list.querySelector('.cur');if(c)c.scrollIntoView({block:'center'});
}
hist.onclick=openList;
document.getElementById('close').onclick=()=>panel.classList.remove('show');
panel.onclick=e=>{if(e.target===panel)panel.classList.remove('show')};
list.onclick=e=>{const b=e.target.closest('.item');if(!b||b.disabled)return;const k=+b.dataset.k;cur=k===Math.min(today(),N)?null:k;panel.classList.remove('show');markSeen();render()};
document.getElementById('again').onclick=()=>{document.getElementById('reveal').classList.remove('show');openList()};
const cv=document.getElementById('c'),cx=cv.getContext('2d');let ps=[],run=false;
function sz(){cv.width=innerWidth;cv.height=innerHeight}sz();addEventListener('resize',sz);
function confetti(){const cols=['#ffd36b','#ff9ec7','#7fd0ff','#fff','#b79bff'];
 for(let k=0;k<160;k++)ps.push({x:cv.width/2,y:cv.height*.55,vx:(Math.random()-.5)*16,vy:-Math.random()*16-4,r:Math.random()*6+3,c:cols[k%5],a:Math.random()*6,l:1});
 if(!run){run=true;loop()}}
function loop(){cx.clearRect(0,0,cv.width,cv.height);ps.forEach(p=>{p.vy+=.25;p.x+=p.vx;p.y+=p.vy;p.a+=.2;p.l-=.006;cx.save();cx.globalAlpha=Math.max(p.l,0);cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;cx.fillRect(-p.r,-p.r/2,p.r*2,p.r);cx.restore()});
 ps=ps.filter(p=>p.l>0&&p.y<cv.height+20);if(ps.length)requestAnimationFrame(loop);else run=false}
// L'heure vient du serveur qui héberge la page (si possible), pas seulement du téléphone.
function sync(){return fetch(location.href,{method:'HEAD',cache:'no-store'}).then(r=>{const d=Date.parse(r.headers.get('date'));if(!isNaN(d))off=d-Date.now()}).catch(()=>{})}
render();sync().then(()=>{if(today()!==lastDay){cur=null;render()}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync().then(()=>{if(today()!==lastDay){cur=null;render()}})});
})();
</script></body></html>
