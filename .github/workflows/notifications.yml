name: Notifications des indices

on:
  schedule:
    - cron: '17 * * * *'   # toutes les heures ; le script n'envoie que si un indice arrive dans l'heure
  workflow_dispatch:
    inputs:
      test:
        description: 'Envoyer une notification de test maintenant'
        type: boolean
        default: true

concurrency:
  group: notifications
  cancel-in-progress: false

jobs:
  notifier:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock nodemailer@6.9.16
      - run: node .github/scripts/notifier.mjs ${{ (github.event_name == 'workflow_dispatch' && inputs.test) && 'test' || '' }}
        env:
          DESTINATAIRES: ${{ secrets.DESTINATAIRES }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
